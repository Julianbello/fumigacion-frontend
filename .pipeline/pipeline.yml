# .pipeline/pipeline.yml — fumigacion-frontend
# Pipeline CI/CD — Sistema de Control de Fumigación (Azure DevOps)
# Despliegue en Azure App Service (Linux, Node.js)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  artifactName: 'app-fumigacion-frontend-$(Build.SourceVersion)'
  # --- CAMBIA ESTOS 4 VALORES ---
  AZURE_SERVICE_CONNECTION: 'azure-fumigacion'
  WEBAPP_DEV: 'fumigacion-frontend-julianbello'
  WEBAPP_QA: 'fumigacion-frontend-julianbello'
  WEBAPP_PROD: 'fumigacion-frontend-julianbello'
  SITE_URL: 'https://fumigacion-frontend-julianbello.azurewebsites.net'
  # --- SonarCloud: déjalo en 'false' hasta tenerlo configurado ---
  RUN_SONAR: 'true'
  SONAR_SERVICE_CONNECTION: 'sonarcloud-fumigacion'
  SONAR_ORGANIZATION: 'julianbello'
  SONAR_PROJECT_KEY: 'Julianbello_fumigacion-frontend'

stages:

# ---------- COMPILE ----------
- stage: Compile
  displayName: 'Compile'
  jobs:
  - job: Build
    displayName: 'Build app'
    steps:
    - task: UseNode@1
      inputs:
        version: $(NODE_VERSION)
      displayName: 'Install Node.js'
    - script: |
        npm ci
        npm run build
      displayName: 'npm ci && build'

# ---------- QUALITY GATES ----------
- stage: QualityGates
  displayName: 'Quality Gates'
  dependsOn: Compile
  jobs:
  - job: Lint
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: npm run lint
      displayName: 'Lint'

  - job: UnitTests
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: npm test -- --ci --coverage
      displayName: 'Unit tests'
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'junit.xml'
    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

  - ${{ if eq(variables['RUN_SONAR'], 'true') }}:
    - job: SonarCloud
      displayName: 'Análisis de código (SonarCloud)'
      steps:
      - checkout: self
        fetchDepth: 0
      - task: UseNode@1
        inputs: { version: $(NODE_VERSION) }
      - task: SonarCloudPrepare@4
        displayName: 'SonarCloud: preparar análisis'
        inputs:
          SonarCloud: '$(SONAR_SERVICE_CONNECTION)'
          organization: '$(SONAR_ORGANIZATION)'
          scannerMode: 'cli'
          configMode: 'manual'
          cliProjectKey: '$(SONAR_PROJECT_KEY)'
          cliProjectName: 'fumigacion-frontend'
          cliSources: 'src,public'
      - script: npm ci
        displayName: 'Install deps'
      - script: npm test -- --ci --coverage
        displayName: 'Pruebas con cobertura (para SonarCloud)'
      - task: SonarCloudAnalyze@4
        displayName: 'SonarCloud: analizar código'
        inputs:
          jdkversion: 'JAVA_HOME_17_X64'
      - task: SonarCloudPublish@4
        displayName: 'SonarCloud: publicar resultado del Quality Gate'
        inputs:
          pollingTimeoutSec: '300'

# ---------- PACKAGE ----------
# App Service instala las dependencias al desplegar
# (SCM_DO_BUILD_DURING_DEPLOYMENT=true), por eso el ZIP no lleva node_modules.
- stage: Package
  displayName: 'Package'
  dependsOn: QualityGates
  jobs:
  - job: Package
    steps:
    - script: |
        zip -qr "$(Build.ArtifactStagingDirectory)/$(artifactName).zip" package.json package-lock.json src public
        ls -lh "$(Build.ArtifactStagingDirectory)"
      displayName: 'Package artifact (zip)'
    - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
      artifact: package

# ---------- DEPLOY DEV ----------
- stage: DeployDev
  displayName: 'Deploy DEV'
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (DEV)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_DEV)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'

# ---------- DEPLOY QA ----------
- stage: DeployQA
  displayName: 'Deploy QA'
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (QA)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_QA)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'
          - checkout: self
          - task: UseNode@1
            inputs: { version: $(NODE_VERSION) }
          - script: |
              npm ci
              npm run test:integration
            workingDirectory: '$(Build.SourcesDirectory)'
            displayName: 'Integration tests'

# ---------- DEPLOY PROD ----------
- stage: DeployProd
  displayName: 'Deploy PROD'
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (PROD)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_PROD)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'

# ---------- SECURITY SCANS ----------
- stage: SecurityScans
  displayName: 'ZAP y Lighthouse'
  dependsOn: DeployProd
  condition: succeeded()
  jobs:
  - job: Lighthouse
    displayName: 'Lighthouse'
    steps:
    - task: UseNode@1
      inputs: { version: '22.x' }
    - script: |
        for i in 1 2 3 4 5; do
          curl -fsS -o /dev/null "$(SITE_URL)/login.html" && break
          sleep 15
        done
      displayName: 'Despertar el sitio'
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/lighthouse"
        npx --yes lighthouse "$(SITE_URL)/login.html" \
          --chrome-flags="--headless=new --no-sandbox" \
          --output=html --output=json \
          --output-path="$(Build.ArtifactStagingDirectory)/lighthouse/reporte" --quiet
      displayName: 'Ejecutar Lighthouse'
    - publish: '$(Build.ArtifactStagingDirectory)/lighthouse'
      artifact: lighthouse
      condition: succeededOrFailed()

  - job: ZAP
    displayName: 'OWASP ZAP (baseline)'
    steps:
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/zap"
        chmod 777 "$(Build.ArtifactStagingDirectory)/zap"
        docker run --rm -v "$(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw" \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py -t "$(SITE_URL)" -r zap-reporte.html -I
      displayName: 'Escaneo baseline de ZAP'
    - publish: '$(Build.ArtifactStagingDirectory)/zap'
      artifact: zap
      condition: succeededOrFailed()