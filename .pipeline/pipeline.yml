
# ============================================================
# Azure DevOps CI/CD
# Sistema de Control de Fumigacion - Frontend
# Despliegue en Azure App Service Linux
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  NODE_VERSION: '20.x'
  artifactName: 'app-fumigacion-frontend-$(Build.SourceVersion)'
  AZURE_SERVICE_CONNECTION: 'azure-fumigacion'
  WEBAPP_DEV: 'fumigacion-frontend-julianbello'
  WEBAPP_QA: 'fumigacion-frontend-julianbello'
  WEBAPP_PROD: 'fumigacion-frontend-julianbello'
  SONAR_SERVICE_CONNECTION: 'sonarcloud-fumigacion'
  SONAR_ORGANIZATION: 'julianbello'
  SONAR_PROJECT_KEY: 'Julianbello_fumigacion-frontend'

stages:

  # ----------------------------------------------------------
  # 1. COMPILACION
  # ----------------------------------------------------------
  - stage: Compile
    displayName: 'Compile'
    jobs:
      - job: Build
        displayName: 'Build app'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: |
              npm ci
              npm run build
            displayName: 'Install dependencies and build'

  # ----------------------------------------------------------
  # 2. QUALITY GATES
  # ----------------------------------------------------------
  - stage: QualityGates
    displayName: 'Quality Gates'
    dependsOn: Compile
    condition: succeeded()
    jobs:

      # LINT
      - job: Lint
        displayName: 'Lint'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'Run lint'

      # PRUEBAS UNITARIAS
      - job: UnitTests
        displayName: 'Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm test -- --ci --coverage
            displayName: 'Run unit tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'junit.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              failTaskOnFailedTests: false

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              failIfCoverageEmpty: false

      # ANALISIS SONARCLOUD
      - job: SonarCloud
        displayName: 'Code analysis SonarCloud'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - task: SonarCloudPrepare@3
            displayName: 'SonarCloud: prepare analysis'
            inputs:
              SonarCloud: '$(SONAR_SERVICE_CONNECTION)'
              organization: '$(SONAR_ORGANIZATION)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(SONAR_PROJECT_KEY)'
              cliProjectName: 'fumigacion-frontend'
              cliSources: 'src'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm test -- --ci --coverage
            displayName: 'Tests with coverage'
            continueOnError: false

          - task: SonarCloudAnalyze@3
            displayName: 'SonarCloud: analyze code'
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          - task: SonarCloudPublish@3
            displayName: 'SonarCloud: publish Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

  # ----------------------------------------------------------
  # 3. EMPAQUETADO
  # ----------------------------------------------------------
  - stage: Package
    displayName: 'Package'
    dependsOn: QualityGates
    condition: succeeded()
    jobs:
      - job: PackageApp
        displayName: 'Create deployment package'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: |
              npm ci
              npm run build
            displayName: 'Build frontend for deployment'

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              zip -qr "$(Build.ArtifactStagingDirectory)/$(artifactName).zip" . \
                -x "node_modules/*" \
                   ".git/*" \
                   "coverage/*" \
                   "$(Build.ArtifactStagingDirectory)/*"
              ls -lh "$(Build.ArtifactStagingDirectory)"
            displayName: 'Create ZIP artifact'

          - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            artifact: package
            displayName: 'Publish deployment artifact'

  # ----------------------------------------------------------
  # 4. DEPLOY DEV
  # ----------------------------------------------------------
  - stage: DeployDev
    displayName: 'Deploy DEV'
    dependsOn: Package
    condition: succeeded()
    jobs:
      - deployment: DeployDevJob
        displayName: 'Deploy to DEV'
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy frontend DEV'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    appType: 'webAppLinux'
                    appName: '$(WEBAPP_DEV)'
                    package: '$(Pipeline.Workspace)/package/$(artifactName).zip'

  # ----------------------------------------------------------
  # 5. DEPLOY QA
  # ----------------------------------------------------------
  - stage: DeployQA
    displayName: 'Deploy QA'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployQAJob
        displayName: 'Deploy and test QA'
        environment: 'qa'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy frontend QA'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    appType: 'webAppLinux'
                    appName: '$(WEBAPP_QA)'
                    package: '$(Pipeline.Workspace)/package/$(artifactName).zip'

                - checkout: self

                - task: NodeTool@0
                  displayName: 'Install Node.js'
                  inputs:
                    versionSpec: '$(NODE_VERSION)'

                - script: |
                    npm ci
                    npm run test:integration
                  displayName: 'Run integration tests'

  # ----------------------------------------------------------
  # 6. DEPLOY PROD
  # ----------------------------------------------------------
  - stage: DeployProd
    displayName: 'Deploy PROD'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - deployment: DeployProdJob
        displayName: 'Deploy to production'
        environment: 'prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy frontend PROD'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    appType: 'webAppLinux'
                    appName: '$(WEBAPP_PROD)'
                    package: '$(Pipeline.Workspace)/package/$(artifactName).zip'
