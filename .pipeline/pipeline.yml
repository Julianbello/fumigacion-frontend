# .pipeline/pipeline.yml — fumigacion-frontend
# Pipeline CI/CD homologado — Sistema de Control de Fumigación (Azure DevOps)

trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  artifactName: 'app-fumigacion-frontend-$(Build.SourceVersion)'

stages:

# ---------- COMPILE ----------
- stage: Compile
  displayName: 'Compile'
  jobs:
  - job: Build
    displayName: 'Build app'
    steps:
    - task: UseNode@1
      inputs:
        version: $(NODE_VERSION)
      displayName: 'Install Node.js'
    - script: |
        npm ci
        npm run build
      displayName: 'npm ci && build'

# ---------- QUALITY GATES ----------
- stage: QualityGates
  displayName: 'Quality Gates'
  dependsOn: Compile
  jobs:
  - job: Lint
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: ESLINT_USE_FLAT_CONFIG=false npm run lint
      displayName: 'Lint'

  - job: StaticAnalysis
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: |
        npx sonar-scanner \
          -Dsonar.host.url=$(SONAR_HOST_URL) \
          -Dsonar.token=$(SONAR_TOKEN) \
          -Dsonar.projectKey=fumigacion-frontend \
          -Dsonar.qualitygate.wait=true
      displayName: 'SonarQube analysis'

  - job: UnitTests
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: npm test -- --ci --coverage
      displayName: 'Unit tests'
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'junit.xml'
    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

# ---------- PACKAGE ----------
- stage: Package
  displayName: 'Package'
  dependsOn: QualityGates
  jobs:
  - job: Package
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: |
        npm prune --production
        tar -czf $(artifactName).tar.gz package.json src public node_modules
      displayName: 'Package artifact'
    - publish: '$(System.DefaultWorkingDirectory)/$(artifactName).tar.gz'
      artifact: package

# ---------- DEPLOY DEV ----------
- stage: DeployDev
  displayName: 'Deploy DEV'
  dependsOn: Package
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: package
          - script: ./scripts/deploy.sh dev
            displayName: 'Deploy to DEV'

# ---------- DEPLOY QA ----------
- stage: DeployQA
  displayName: 'Deploy QA'
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: package
          - script: |
              ./scripts/deploy.sh qa
              npm run test:integration
            displayName: 'Deploy to QA + integration tests'

# ---------- DEPLOY PROD ----------
- stage: DeployProd
  displayName: 'Deploy PROD'
  dependsOn: DeployQA
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: package
          - script: ./scripts/deploy.sh prod
            displayName: 'Deploy to PROD'