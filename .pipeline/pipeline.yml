# .pipeline/pipeline.yml — fumigacion-frontend
# Pipeline CI/CD — Sistema de Control de Fumigación (Azure DevOps)
# Despliegue en Azure App Service (Linux, Node.js)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  artifactName: 'app-fumigacion-frontend-$(Build.SourceVersion)'
  # --- CAMBIA ESTOS 4 VALORES ---
  AZURE_SERVICE_CONNECTION: 'azure-fumigacion'
  WEBAPP_DEV: 'fumigacion-frontend-julianbello'
  WEBAPP_QA: 'fumigacion-frontend-julianbello'
  WEBAPP_PROD: 'fumigacion-frontend-julianbello'

stages:

# ---------- COMPILE ----------
- stage: Compile
  displayName: 'Compile'
  jobs:
  - job: Build
    displayName: 'Build app'
    steps:
    - task: UseNode@1
      inputs:
        version: $(NODE_VERSION)
      displayName: 'Install Node.js'
    - script: |
        npm ci
        npm run build
      displayName: 'npm ci && build'

# ---------- QUALITY GATES ----------
- stage: QualityGates
  displayName: 'Quality Gates'
  dependsOn: Compile
  jobs:
  - job: Lint
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: npm run lint
      displayName: 'Lint'

  - job: UnitTests
    steps:
    - task: UseNode@1
      inputs: { version: $(NODE_VERSION) }
    - script: npm ci
      displayName: 'Install deps'
    - script: npm test -- --ci --coverage
      displayName: 'Unit tests'
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'junit.xml'
    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

# ---------- PACKAGE ----------
# App Service instala las dependencias al desplegar
# (SCM_DO_BUILD_DURING_DEPLOYMENT=true), por eso el ZIP no lleva node_modules.
- stage: Package
  displayName: 'Package'
  dependsOn: QualityGates
  jobs:
  - job: Package
    steps:
    - script: |
        zip -qr "$(Build.ArtifactStagingDirectory)/$(artifactName).zip" package.json package-lock.json src public
        ls -lh "$(Build.ArtifactStagingDirectory)"
      displayName: 'Package artifact (zip)'
    - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
      artifact: package

# ---------- DEPLOY DEV ----------
- stage: DeployDev
  displayName: 'Deploy DEV'
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (DEV)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_DEV)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'

# ---------- DEPLOY QA ----------
- stage: DeployQA
  displayName: 'Deploy QA'
  dependsOn: DeployDev
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (QA)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_QA)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'
          - checkout: self
          - task: UseNode@1
            inputs: { version: $(NODE_VERSION) }
          - script: |
              npm ci
              npm run test:integration
            workingDirectory: '$(Build.SourcesDirectory)'
            displayName: 'Integration tests'

# ---------- DEPLOY PROD ----------
- stage: DeployProd
  displayName: 'Deploy PROD'
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service (PROD)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              appType: 'webAppLinux'
              appName: '$(WEBAPP_PROD)'
              runtimeStack: 'NODE|22-lts'
              package: '$(Pipeline.Workspace)/package/*.zip'