<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inventario — Control de Fumigación</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-titulo="Inventario">
  <main class="content">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;">
      <div class="card">
        <h2>Nuevo tipo de producto</h2>
        <form id="tipoForm">
          <div class="form-group">
            <label for="tipoNombre">Nombre del tipo</label>
            <input id="tipoNombre" placeholder="Ej. cochinilla" minlength="2" maxlength="40" required />
          </div>
          <button type="submit" class="btn-primary">Agregar tipo</button>
        </form>
        <p id="mensajeTipo" class="mensaje"></p>
      </div>
      <div class="card">
        <h2>Nuevo producto</h2>
        <form id="productoForm">
          <div class="form-group">
            <label for="productoNombre">Nombre del producto</label>
            <input id="productoNombre" placeholder="Ej. Fungicida Z" minlength="2" maxlength="80" required />
          </div>
          <div class="form-group">
            <label for="productoTipo">Tipo de producto</label>
            <select id="productoTipo" required>
              <option value="">Cargando tipos...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="productoDosis">Dosis (ml por litro)</label>
            <input id="productoDosis" type="number" step="0.1" min="0.1" placeholder="Ej. 3" required />
          </div>
          <div class="form-group">
            <label for="productoStock">Stock inicial (litros)</label>
            <input id="productoStock" type="number" step="0.1" min="0" placeholder="Ej. 20" required />
          </div>
          <button type="submit" class="btn-primary">Agregar producto</button>
        </form>
        <p id="mensajeProducto" class="mensaje"></p>
      </div>
    </div>
    <div class="card">
      <h2>Stock disponible por producto (HU09)</h2>
      <table class="data-table">
        <thead><tr><th>Producto</th><th>Categoría</th><th>Dosis (ml/L)</th><th>Stock restante (L)</th></tr></thead>
        <tbody id="tablaInventario"><tr><td colspan="4">Cargando...</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
