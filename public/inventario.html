<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inventario — Control de Fumigación</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="icon">🐛</span> Fumigación</div>
      <nav>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="fumigacion.html">🧪 Registrar Fumigación</a>
        <a href="inventario.html">📦 Inventario</a>
        <a href="historial.html">🗒️ Historial</a>
      </nav>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <h1>Inventario</h1>
        <div class="user-box">
          <span id="topbarUserName">Cargando...</span>
          <div class="avatar" id="topbarUserInitial">?</div>
          <button class="btn-logout" id="logoutBtn">Salir</button>
        </div>
      </header>
      <main class="content">
        <div class="card">
          <h2>Stock disponible por producto (HU09)</h2>
          <table class="data-table">
            <thead><tr><th>Producto</th><th>Categoría</th><th>Dosis (ml/L)</th><th>Stock restante (L)</th></tr></thead>
            <tbody id="tablaInventario"><tr><td colspan="4">Cargando...</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
