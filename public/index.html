<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Control de Fumigación — Ingreso</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="icon-wrap">🐛</div>
    <h1>Control de Fumigación</h1>
    <p class="subtitle">Ingresa con tu usuario para continuar</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" placeholder="admin" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="********" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Ingresar</button>
    </form>
    <p id="mensaje" class="mensaje"></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
