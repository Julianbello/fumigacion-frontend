<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Registrar Fumigación</title></head>
<body>
  <h1>Registrar ejecución de fumigación</h1>
  <form id="fumigacionForm">
    <input id="productoId" type="number" placeholder="ID producto" required />
    <input id="litros" type="number" step="0.1" placeholder="Litros aplicados" required />
    <input id="categoria" placeholder="Categoría (ej. polvoso)" required />
    <button type="submit">Registrar</button>
  </form>
  <p id="resultado"></p>
  <script src="js/api.js"></script>
  <script src="js/fumigacion.js"></script>
</body>
</html>
